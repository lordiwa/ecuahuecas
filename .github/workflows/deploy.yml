# Deploy ecuahuecas (SSG) to Firebase Hosting on every push to main.
#
# The build runs `npm run build`, which is:
#   node scripts/snapshot-sanity.mjs && vite-ssg build
# The snapshot step reads Sanity WITH a token (SANITY_READ_TOKEN secret, since
# anonymous reads of the migrated docs return 0) and writes
# src/content-snapshot.json; vite-ssg then bakes per-route static HTML + per-page
# OG into dist/. The result is deployed to the Firebase default domain
# https://ecuahuecas.web.app (channel: live).
#
# Required GitHub repo configuration (see DEPLOY.md):
#   Secrets:   SANITY_READ_TOKEN, FIREBASE_TOKEN
#   Variables: VITE_SANITY_PROJECT_ID, VITE_SANITY_DATASET,
#              VITE_FIREBASE_API_KEY, VITE_FIREBASE_AUTH_DOMAIN,
#              VITE_FIREBASE_PROJECT_ID, VITE_FIREBASE_STORAGE_BUCKET,
#              VITE_FIREBASE_MESSAGING_SENDER_ID, VITE_FIREBASE_APP_ID
# (The VITE_* values are PUBLIC / bundle-safe, hence stored as Variables.)
#
# Deploy auth: the org enforces iam.disableServiceAccountKeyCreation, so we
# CANNOT use a service-account JSON. We deploy with firebase-tools using a
# Firebase CI token (FIREBASE_TOKEN secret, from `firebase login:ci`).
#
# NOTE: Cloud Functions are deployed separately, NOT by this workflow.
name: Deploy to Firebase Hosting

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: 'Build SSG (Sanity snapshot + vite-ssg)'
        env:
          # Secret: Sanity read token (snapshot reads WITH this).
          SANITY_READ_TOKEN: ${{ secrets.SANITY_READ_TOKEN }}
          # Public, bundle-safe VITE_* (GitHub Actions Variables).
          VITE_SANITY_PROJECT_ID: ${{ vars.VITE_SANITY_PROJECT_ID }}
          VITE_SANITY_DATASET: ${{ vars.VITE_SANITY_DATASET }}
          VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ vars.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID }}
          # Canonical site URL used for OG/SEO (Firebase default domain).
          VITE_SITE_URL: https://ecuahuecas.web.app
        run: npm run build

      - name: 'Deploy to Firebase Hosting (channel live)'
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: npx -y firebase-tools@^14 deploy --only hosting --project ecuahuecas --non-interactive
